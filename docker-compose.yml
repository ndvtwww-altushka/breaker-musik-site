version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENABLE_PLAYWRIGHT=1
    volumes:
      - ./:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  playwright:
    image: mcr.microsoft.com/playwright:v1.50-jammy
    command: sleep infinity
    profiles: ["playwright"]
    volumes:
      - ./:/app